<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Preços</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/app.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Comparador de Preços</h1>
        <div id="lista-inputs">
            <input type="text" class="link-input" placeholder="Cole o link do produto">
        </div>
        <button id="btn-adicionar" type="button">+ Adicionar link</button>
        <button id="btn-processar">Processar</button>
        <div id="resultado"></div>
        <div id="total"></div>
    </div>
</body>
</html>
